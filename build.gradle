plugins {
    // 26.3-era Loom is published under its fully-qualified plugin id; the short 'fabric-loom' alias
    // is not resolved for 1.17.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // No `mappings` line, and no officialMojangMappings(). From 26.x Mojang ships the client
    // unobfuscated, so there is nothing to map: mixin targets are written as the real names and go
    // into the jar exactly as written. On 1.21.11 this project needed both, and a refmap behind them.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Deliberately no Fabric API. Everything here is Mixin plus one loader entrypoint, so the jar
    // drops into any 26.3 Fabric install on its own — nothing to install alongside it.

    // Cloth Config is a soft dependency: the config screen is built with its ConfigBuilder, but
    // FrogChatModMenu checks FabricLoader before touching it and falls back to a plain screen
    // without it. Loom 1.17 dropped the modImplementation DSL — plain implementation puts the jar
    // on the classpath, and on 26.x there is no remap step to miss. (Cloth's own docs say the same
    // for 26.x.)
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // Mod Menu is a soft dependency: compile against its API so the Mods screen gets a config
    // button, but the mod runs fine without it installed.
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "id", project.mod_id
    inputs.property "name", project.mod_name
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "id": project.mod_id,
                "name": project.mod_name,
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

// 25, not 21: Minecraft 26.3 is built for Java 25 and its own mods declare `java: >=25`.
def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
