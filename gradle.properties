# Gradle
org.gradle.jvmargs=-Xmx2G

# Minecraft 26.3 is compiled to Java 25 bytecode, so whatever JVM Gradle runs on has to be able to READ
# class version 69 — a JDK 21 javac rejects the classpath outright. JDK 26 is the newest installed here;
# `release = 25` in build.gradle is what pins what we emit.
org.gradle.java.home=C:/Program Files/Java/jdk-26.0.1

# Minecraft / Fabric — see https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Menu — soft dependency for the in-game config button. 21.0.0 is the 26.3 build:
# https://modrinth.com/mod/modmenu/versions
modmenu_version=21.0.0

# Cloth Config — hard dependency, provides the config screen. 26.3.159 is the 26.3 build:
# https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-fabric/
cloth_config_version=26.3.159

# Mod identity
mod_version=1.0.0
mod_name=FrogChat
mod_id=frogchat
maven_group=dev.frogchat
archives_base_name=frogchat
